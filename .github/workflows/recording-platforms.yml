# The microphone and video recording on Windows and macOS, in the official
# Slicer 5.12.4: the unit tests in Slicer's Python, then
# Testing/integration_recording.py inside Slicer (a stand-in microphone,
# the real views, real ffmpeg encoding).
name: Recording on Windows and macOS

on:
  push:
    branches: [ci/recording-windows-macos]
  workflow_dispatch:

env:
  SLICER_WIN_URL: https://download.slicer.org/bitstream/6aa1db04ce9de556d30112bb      # 5.12.4, r34645
  SLICER_MAC_URL: https://download.slicer.org/bitstream/6aa2063bce9de556d30132d8      # 5.12.4, r34645
  MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z

jobs:
  recording:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Install Slicer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\slicer.exe" $env:SLICER_WIN_URL
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\slicer.exe" -ArgumentList '/S', '/D=C:\Slicer'
          Get-ChildItem C:\Slicer, C:\Slicer\bin | Select-Object -First 40 | Format-Table -AutoSize Name, Length
          "SLICER=C:\Slicer\Slicer.exe" >> $env:GITHUB_ENV
          "PYTHONSLICER=C:\Slicer\bin\PythonSlicer.exe" >> $env:GITHUB_ENV
          Get-ChildItem -Recurse C:\Slicer\lib\QtPlugins\audio -ErrorAction SilentlyContinue | Format-Table -AutoSize FullName

      - name: Software OpenGL for Slicer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\mesa.7z" $env:MESA_URL
          7z x "$env:RUNNER_TEMP\mesa.7z" -o"$env:RUNNER_TEMP\mesa" | Out-Null
          foreach ($dll in 'opengl32.dll', 'libgallium_wgl.dll', 'libglapi.dll', 'dxil.dll') {
            $source = Join-Path "$env:RUNNER_TEMP\mesa\x64" $dll
            if (Test-Path $source) { Copy-Item $source C:\Slicer\bin\; "copied $dll" }
          }
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV

      - name: ffprobe for the test's checks (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Slicer (macOS)
        if: runner.os == 'macOS'
        run: |
          uname -m; sw_vers; sysctl -n machdep.cpu.brand_string
          curl -sSL -o "$RUNNER_TEMP/slicer.dmg" "$SLICER_MAC_URL"
          yes | hdiutil attach "$RUNNER_TEMP/slicer.dmg" -nobrowse -mountpoint /Volumes/Slicer > /dev/null
          cp -R /Volumes/Slicer/Slicer.app "$RUNNER_TEMP/"
          hdiutil detach /Volumes/Slicer
          echo "SLICER=$RUNNER_TEMP/Slicer.app/Contents/MacOS/Slicer" >> "$GITHUB_ENV"
          echo "PYTHONSLICER=$RUNNER_TEMP/Slicer.app/Contents/bin/PythonSlicer" >> "$GITHUB_ENV"
          file "$RUNNER_TEMP/Slicer.app/Contents/MacOS/Slicer" "$RUNNER_TEMP/Slicer.app/Contents/bin/SlicerApp-real"
          ls "$RUNNER_TEMP/Slicer.app/Contents/lib/QtPlugins/audio" || true
          codesign -dv "$RUNNER_TEMP/Slicer.app" 2>&1 | grep -E "Identifier|flags|Authority" || true
          codesign -d --entitlements - --xml "$RUNNER_TEMP/Slicer.app/Contents/bin/SlicerApp-real" 2>/dev/null | plutil -p - || true
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$RUNNER_TEMP/Slicer.app/Contents/Info.plist" || echo "no NSMicrophoneUsageDescription"

      - name: ffprobe for the test's checks (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg in Slicer's Python, as "Get ffmpeg..." installs it
        shell: bash
        run: |
          "$PYTHONSLICER" -m pip install --quiet imageio-ffmpeg
          "$PYTHONSLICER" -c "import imageio_ffmpeg, subprocess; exe = imageio_ffmpeg.get_ffmpeg_exe(); print(exe); print(subprocess.run([exe, '-version'], capture_output=True, text=True).stdout.splitlines()[0])"

      - name: Unit tests in Slicer's Python
        shell: bash
        run: |
          "$PYTHONSLICER" -m unittest discover -s Testing -p "test_*.py" 2>&1 | tail -30

      - name: Recording integration test in Slicer
        shell: bash
        timeout-minutes: 25
        env:
          GTREVIEW_TEST_LOG: ${{ runner.temp }}/recording-test.log
        run: |
          "$SLICER" --no-splash --disable-settings --ignore-slicerrc \
            --additional-module-path "$GITHUB_WORKSPACE/GTReview" \
            --python-script "$GITHUB_WORKSPACE/Testing/integration_recording.py" || echo "Slicer exited with $?"
          cat "$GTREVIEW_TEST_LOG" || true
          grep -q "^RESULT: PASS" "$GTREVIEW_TEST_LOG"

      # ---------------------------------------------------------------- Windows
      # What the microphone really hands Slicer: VB-CABLE, a virtual audio
      # cable, carries a 440 Hz tone from its playback side to its recording side.
      - name: A virtual microphone (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@v1

      - name: What Slicer hears from it (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        env:
          PROBE_REPORT: ${{ runner.temp }}\probe-windows.json
          PROBE_DEVICE: cable
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Name, Status
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status
          foreach ($key in 'HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone',
                           'HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged',
                           'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone') {
            "{0}: {1}" -f $key, (Get-ItemProperty -Path $key -Name Value -ErrorAction SilentlyContinue).Value
          }
          python -c "import math, struct, wave; w = wave.open(r'$env:RUNNER_TEMP\tone.wav', 'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(48000); w.writeframes(b''.join(struct.pack('<h', int(8000 * math.sin(2 * math.pi * 440 * i / 48000))) for i in range(48000 * 30))); w.close()"
          $player = New-Object System.Media.SoundPlayer "$env:RUNNER_TEMP\tone.wav"
          $player.PlayLooping()
          Start-Process -Wait -FilePath $env:SLICER -ArgumentList '--no-splash', '--disable-settings', '--ignore-slicerrc', '--no-main-window', '--additional-module-path', "$env:GITHUB_WORKSPACE\GTReview", '--python-script', "$env:GITHUB_WORKSPACE\.github\scripts\microphone_probe.py"
          $player.Stop()
          Get-Content $env:PROBE_REPORT

      - name: Whether anything can record from it here, ffmpeg through DirectShow (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          ffmpeg -hide_banner -list_devices true -f dshow -i dummy 2>&1 | Select-String -Pattern "audio|CABLE"
          $player = New-Object System.Media.SoundPlayer "$env:RUNNER_TEMP\tone.wav"
          $player.PlayLooping()
          ffmpeg -hide_banner -y -f dshow -i "audio=CABLE Output (VB-Audio Virtual Cable)" -t 3 "$env:RUNNER_TEMP\dshow.wav" 2>&1 | Select-Object -Last 12
          $player.Stop()
          ffmpeg -hide_banner -i "$env:RUNNER_TEMP\dshow.wav" -af volumedetect -f null - 2>&1 | Select-String -Pattern "mean_volume|max_volume"

      - name: The same with "Let desktop apps access your microphone" on (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        env:
          PROBE_REPORT: ${{ runner.temp }}\probe-windows-allowed.json
          PROBE_DEVICE: cable
        run: |
          foreach ($key in 'HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone',
                           'HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged',
                           'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone') {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
          }
          $player = New-Object System.Media.SoundPlayer "$env:RUNNER_TEMP\tone.wav"
          $player.PlayLooping()
          Start-Process -Wait -FilePath $env:SLICER -ArgumentList '--no-splash', '--disable-settings', '--ignore-slicerrc', '--no-main-window', '--additional-module-path', "$env:GITHUB_WORKSPACE\GTReview", '--python-script', "$env:GITHUB_WORKSPACE\.github\scripts\microphone_probe.py"
          $player.Stop()
          Get-Content $env:PROBE_REPORT

      # ------------------------------------------------------------------ macOS
      # What the microphone really hands Slicer: BlackHole, a virtual audio
      # device, carries a 440 Hz tone from its output to its input.  Started
      # from this shell, Slicer is judged by the shell's permission; started
      # with `open`, as the Dock and the Finder do, by its own app.
      - name: A virtual microphone playing a tone (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          brew install blackhole-2ch switchaudio-osx
          sudo killall coreaudiod || true
          sleep 8
          SwitchAudioSource -a -t input || true
          SwitchAudioSource -t output -s "BlackHole 2ch"
          python3 -c "
          import math, struct, wave
          rate = 48000
          with wave.open('$RUNNER_TEMP/tone.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              w.writeframes(b''.join(struct.pack('<h', int(8000 * math.sin(2 * math.pi * 440 * i / rate))) for i in range(rate * 180)))
          "
          cat > "$RUNNER_TEMP/probe.sh" <<'PROBE'
          # $1: "shell" (Slicer started from here) or "open" (as the Dock does)
          afplay "$RUNNER_TEMP/tone.wav" &
          tone=$!
          sleep 1
          since=$(date "+%Y-%m-%d %H:%M:%S")
          arguments=(--no-splash --disable-settings --ignore-slicerrc --no-main-window
                     --additional-module-path "$GITHUB_WORKSPACE/GTReview"
                     --python-script "$GITHUB_WORKSPACE/.github/scripts/microphone_probe.py")
          if [[ "$1" == open ]]; then
            open -W -n -a "$RUNNER_TEMP/Slicer.app" --env PROBE_REPORT="$PROBE_REPORT" --env PROBE_DEVICE=blackhole --args "${arguments[@]}" || true
          else
            PROBE_DEVICE=blackhole "$SLICER" "${arguments[@]}" || true
          fi
          kill $tone 2> /dev/null || true
          cat "$PROBE_REPORT" || echo "no report: Slicer did not get to write one"
          echo "-- what macOS's privacy service decided"
          sudo log show --start "$since" --predicate 'subsystem == "com.apple.TCC" AND eventMessage CONTAINS[c] "Microphone"' --style compact 2> /dev/null | tail -25 || true
          ls -t ~/Library/Logs/DiagnosticReports 2> /dev/null | head -3 || true
          PROBE

      - name: The official Slicer, started from a shell (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 6
        env:
          PROBE_REPORT: ${{ runner.temp }}/probe-official-shell.json
        run: bash "$RUNNER_TEMP/probe.sh" shell

      - name: The official Slicer, started as the Dock starts it (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 6
        env:
          PROBE_REPORT: ${{ runner.temp }}/probe-official-open.json
        run: bash "$RUNNER_TEMP/probe.sh" open

      - name: Let this Slicer use the microphone, with the script GTReview ships (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -d "$RUNNER_TEMP"/Slicer.app/Contents/*.* || true
          bash GTReview/Resources/GTReviewMacMicrophone.sh "$RUNNER_TEMP/Slicer.app"
          ls -d "$RUNNER_TEMP"/Slicer.app/Contents/*.* || true
          codesign -dv "$RUNNER_TEMP/Slicer.app" 2>&1 | grep -E "Executable|flags|Signature" || true
          codesign -d --entitlements :- "$RUNNER_TEMP/Slicer.app" 2>/dev/null | plutil -p - || true
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$RUNNER_TEMP/Slicer.app/Contents/Info.plist"
          codesign --verify --verbose=2 "$RUNNER_TEMP/Slicer.app" || echo "(the app's seal does not verify)"

      - name: The enabled Slicer, started as the Dock starts it, before anyone allowed it (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 6
        env:
          PROBE_REPORT: ${{ runner.temp }}/probe-enabled-open.json
        run: bash "$RUNNER_TEMP/probe.sh" open

      - name: Allow the microphone, as a click on "Allow" would (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          python3 .github/scripts/mac_tcc_grant.py "$RUNNER_TEMP/Slicer.app"
          sudo python3 .github/scripts/mac_tcc_grant.py "$RUNNER_TEMP/Slicer.app"

      - name: The enabled Slicer, started as the Dock starts it, allowed (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 6
        env:
          PROBE_REPORT: ${{ runner.temp }}/probe-enabled-allowed-open.json
        run: bash "$RUNNER_TEMP/probe.sh" open

      - name: Recording integration test in the enabled Slicer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 25
        env:
          GTREVIEW_TEST_LOG: ${{ runner.temp }}/recording-test-enabled.log
          GTREVIEW_EXPECT_MAC_MICROPHONE: allowed
        run: |
          "$SLICER" --no-splash --disable-settings --ignore-slicerrc \
            --additional-module-path "$GITHUB_WORKSPACE/GTReview" \
            --python-script "$GITHUB_WORKSPACE/Testing/integration_recording.py" || echo "Slicer exited with $?"
          cat "$GTREVIEW_TEST_LOG" || true
          grep -q "^RESULT: PASS" "$GTREVIEW_TEST_LOG"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-test-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/recording-test*.log
            ${{ runner.temp }}/probe-*.json
          if-no-files-found: ignore
